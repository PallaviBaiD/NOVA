<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Orb Python</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: orb on the left, conversation on the right. On a phone they stack. */
  :root {
    --bg: #eef0f7;
    --fg: #1d2033;
    --muted: #6a6f8a;
    --panel: #ffffff;
    --line: #dfe2ee;
    --accent: #5b6cff;
    --accent-2: #9b6bff;
    --accent-fg: #ffffff;
    --input: #f5f6fb;
    --bubble-nova: #eef0fb;
    --bubble-nova-fg: #1d2033;
    --shadow: 0 10px 40px rgba(60, 70, 140, .14);
    --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1120;
      --fg: #eceefc;
      --muted: #9a9fc0;
      --panel: #181b30;
      --line: #2a2e4d;
      --accent: #7482ff;
      --input: #12142a;
      --bubble-nova: #23274a;
      --bubble-nova-fg: #eceefc;
      --shadow: 0 10px 40px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1120;
    --fg: #eceefc;
    --muted: #9a9fc0;
    --panel: #181b30;
    --line: #2a2e4d;
    --accent: #7482ff;
    --input: #12142a;
    --bubble-nova: #23274a;
    --bubble-nova-fg: #eceefc;
    --shadow: 0 10px 40px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background:
      radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(800px 500px at 100% 110%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
  }
  .app {
    height: 100%;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 16px;
    min-height: 0;
  }

  /* ----- the stage (orb) ----- */
  .stage {
    position: relative;
    min-height: 260px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: radial-gradient(circle at 50% 42%, #2e3480 0%, #151843 55%, #0a0c24 100%);
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 66% 78%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 24% 82%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 90% 54%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,.3), transparent);
    pointer-events: none;
  }
  .stage canvas { position: relative; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .name-tag {
    position: absolute;
    left: 22px;
    top: 18px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    color: #fff;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
    pointer-events: none;
  }
  .name-tag small {
    display: block;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: .7;
  }
  .state {
    position: absolute;
    right: 18px;
    top: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    pointer-events: none;
  }
  .state i { width: 8px; height: 8px; border-radius: 50%; background: #7fa0ff; box-shadow: 0 0 10px currentColor; }
  .stage[data-state="listening"] .state i { background: #2ee6c8; }
  .stage[data-state="talking"] .state i { background: #ffb03a; }
  .status {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 16px;
    font-size: 12px;
    color: #fff;
    opacity: .85;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .fail { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #fff; margin: 0; }

  /* ----- the conversation (right side) ----- */
  .panel {
    min-height: 0;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; }
  .panel-head span { color: var(--muted); font-size: 12px; }
  .log {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 2px 4px 2px 0;
    scroll-behavior: smooth;
  }
  .log:empty::before {
    content: "Your conversation with Nova will appear here.";
    margin: auto;
    color: var(--muted);
    text-align: center;
    max-width: 24ch;
    line-height: 1.5;
  }
  .msg {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.45;
    overflow-wrap: anywhere;
    white-space: pre-line;
    animation: pop .22s ease-out;
  }
  .msg.nova { background: var(--bubble-nova); color: var(--bubble-nova-fg); align-self: flex-start; border-bottom-left-radius: 6px; }
  .msg.you {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-fg);
    align-self: flex-end;
    border-bottom-right-radius: 6px;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .chips { display: flex; gap: 10px; }
  .tool {
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--input);
    color: var(--fg);
    cursor: pointer;
    transition: border-color .15s, transform .1s, background .15s;
  }
  .tool::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .tool:hover { border-color: var(--accent); }
  .tool:active { transform: scale(.98); }
  #micBtn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-fg); border-color: transparent; }
  #micBtn::before { background: #fff; }
  #micBtn[aria-pressed="true"]::before { background: #ff5c7a; animation: blink 1s infinite; }
  #muteBtn[aria-pressed="false"]::before { background: #2ecf9a; }
  #muteBtn[aria-pressed="true"]::before { background: #ff5c7a; }
  @keyframes blink { 50% { opacity: .25; } }

  form { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    padding: 13px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--input);
    color: var(--fg);
  }
  input[type="text"]::placeholder { color: var(--muted); }
  .send {
    font: inherit;
    font-weight: 600;
    padding: 13px 22px;
    border-radius: 999px;
    border: 0;
    background: var(--fg);
    color: var(--panel);
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ----- phones and narrow windows: stack them ----- */
  @media (max-width: 820px) {
    body { padding-block: 12px; }
    .app { display: flex; flex-direction: column; gap: 12px; }
    .stage { flex: 1 1 auto; min-height: 220px; border-radius: 24px; }
    .panel { flex: 0 0 auto; border-radius: 24px; padding: 14px; }
    .log { flex: none; height: 170px; }
    .name-tag { font-size: 22px; left: 16px; top: 14px; }
    .state { right: 12px; top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } .stage canvas { cursor: default; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="name-tag">Nova<small>Your AI friend</small></div>
    <div class="state"><i></i><span id="stateLbl">Ready</span></div>
    <div class="status" id="status"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h1>Chat with Nova</h1><span>Replies appear here</span></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips">
      <button class="tool" id="micBtn" type="button" aria-pressed="false">Tap to talk</button>
      <button class="tool" id="muteBtn" type="button" aria-pressed="false">Voice on</button>
    </div>
    <form id="form" autocomplete="off">
      <input type="text" id="msg" placeholder="Say something to Nova" aria-label="Message to Nova">
      <button class="send" type="submit">Send</button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  if (typeof THREE === 'undefined') {
    stage.insertAdjacentHTML('beforeend', '<p class="fail">The 3D tools could not load. Check your internet connection and reload the page.</p>');
    return;
  }

  /* ---------- scene ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.insertBefore(renderer.domElement, stage.firstChild);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f78, 0.9));
  var key = new THREE.DirectionalLight(0xfff1dc, 1.0);
  key.position.set(1.5, 2.5, 3);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xbcd0ff, 0.4);
  rim.position.set(-2, 1.5, -2);
  scene.add(rim);

  var holder = new THREE.Group();   // spins when dragged
  scene.add(holder);

  var greeted = false;
  var focus = { y: 0, viewH: 2.6 };

  /* ---------- sizing and framing ---------- */
  function placeCamera() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    var halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var distH = focus.viewH / (2 * halfTan);
    var distW = (focus.viewH * 0.62) / (2 * halfTan * camera.aspect);
    var dist = Math.max(distH, distW);
    camera.position.set(0, focus.y, dist);
    camera.lookAt(0, focus.y, 0);
    camera.near = dist / 50;
    camera.far = dist * 50;
    camera.updateProjectionMatrix();
  }
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    placeCamera();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);

  /* ---------- status line ---------- */
  var sayTimer = null;
  function say(msg) {
    statusEl.textContent = msg;
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { statusEl.textContent = ''; }, 6000);
  }

  /* ---------- the orb ---------- */
  var orbUniforms = {
    uTime: { value: 0 },
    uLevel: { value: 0 },
    uColor: { value: new THREE.Color(0x5b7cff) },
    uColor2: { value: new THREE.Color(0xb48cff) }
  };
  var orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 96, 96),
    new THREE.ShaderMaterial({
      uniforms: orbUniforms,
      vertexShader: [
        'uniform float uTime; uniform float uLevel;',
        'varying vec3 vN; varying vec3 vV;',
        'void main() {',
        '  vec3 p = position;',
        '  float d = sin(p.x * 3.0 + uTime * 1.5) * sin(p.y * 3.0 + uTime * 1.2) * sin(p.z * 3.0 + uTime * 1.8);',
        '  p += normal * d * (0.05 + uLevel * 0.22);',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  vN = normalize(normalMatrix * normal);',
        '  vV = normalize(-mv.xyz);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uColor; uniform vec3 uColor2; uniform float uLevel; uniform float uTime;',
        'varying vec3 vN; varying vec3 vV;',
        'void main() {',
        '  float f = pow(1.0 - max(dot(normalize(vN), normalize(vV)), 0.0), 2.0);',
        '  float swirl = 0.5 + 0.5 * sin(vN.y * 5.0 + vN.x * 3.0 + uTime * 1.3);',
        '  vec3 col = mix(uColor, uColor2, swirl * 0.6 + f * 0.6);',
        '  col = col * (0.75 + 0.35 * uLevel) + mix(uColor2, vec3(1.0), 0.35) * f * (0.25 + 0.3 * uLevel);',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    })
  );
  holder.add(orb);

  // soft glow behind the orb
  var glowCanvas = document.createElement('canvas');
  glowCanvas.width = glowCanvas.height = 128;
  var gctx = glowCanvas.getContext('2d');
  var grad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.18)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 128, 128);
  var glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(glowCanvas),
    color: 0x5b7cff,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  }));
  glow.scale.set(2.6, 2.6, 1);
  glow.position.z = -0.2;
  holder.add(glow);

  /* ---------- pointer ---------- */
  var pointer = { x: 0, y: 0 }, dragging = false, lastX = 0, spinOffset = 0;
  window.addEventListener('pointermove', function (e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
    if (dragging) { spinOffset += (e.clientX - lastX) * 0.012; lastX = e.clientX; }
  });
  renderer.domElement.addEventListener('pointerdown', function (e) { dragging = true; lastX = e.clientX; });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });

  /* ---------- voice (Python does the speaking, this page only tracks the mute button) ---------- */
  var speaking = false, muted = false, browserSpeaking = false;
  var muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.textContent = muted ? 'Voice off' : 'Voice on';
    post('/mute', { muted: muted }).catch(function () {});
  });
  // languages the PC voice cannot speak are spoken by the browser's own voices (Edge and Chrome have many)
  function speakBrowser(text, lang) {
    if (muted || !('speechSynthesis' in window)) return;
    try {
      var synth = window.speechSynthesis;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var base = (lang || 'en').toLowerCase().split(/[-_]/)[0];
      var vs = synth.getVoices(), pick = null;
      for (var i = 0; i < vs.length && !pick; i++) if (vs[i].lang.toLowerCase().replace('_', '-') === (lang || '').toLowerCase()) pick = vs[i];
      for (var j = 0; j < vs.length && !pick; j++) if (vs[j].lang.toLowerCase().split(/[-_]/)[0] === base) pick = vs[j];
      if (pick) u.voice = pick;
      u.lang = pick ? pick.lang : (lang || 'en');
      u.onstart = function () { browserSpeaking = true; speaking = true; };
      u.onend = u.onerror = function () { browserSpeaking = false; speaking = false; };
      synth.speak(u);
    } catch (err) { browserSpeaking = false; }
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  function showReply(d) {
    addMsg('nova', d.reply);
    if (d.browser_voice) speakBrowser(d.reply, d.lang);
  }
  function showMuted() {
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.textContent = muted ? 'Voice off' : 'Voice on';
  }

  /* ---------- chat ---------- */
  var logEl = document.getElementById('log');
  function addMsg(who, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function nova(text) { addMsg('nova', text); }

  function post(url, data) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data || {})
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function offline() {
    addMsg('nova', 'I cannot reach my Python brain. Is nova_server.py still running?');
  }
  function send(text) {
    text = text.trim();
    if (!text) return;
    addMsg('you', text);
    post('/chat', { text: text }).then(function (d) {
      showReply(d);
    }).catch(offline);
  }
  function greet() {
    post('/greet').then(function (d) { addMsg('nova', d.reply); }).catch(offline);
  }
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('msg');
    send(input.value);
    input.value = '';
  });
  /* ---------- listening (microphone -> Python -> Gemini) ---------- */
  var micBtn = document.getElementById('micBtn');
  var rec = null, recChunks = [], recStream = null, recTimer = null;
  function micReset() {
    micBtn.setAttribute('aria-pressed', 'false');
    micBtn.textContent = 'Tap to talk';
    clearTimeout(recTimer);
    if (recStream) { recStream.getTracks().forEach(function (t) { t.stop(); }); recStream = null; }
  }
  function blobToB64(blob) {
    return new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1] || ''); };
      fr.readAsDataURL(blob);
    });
  }
  function stopRec() { if (rec && rec.state === 'recording') rec.stop(); }
  micBtn.addEventListener('click', function () {
    if (rec && rec.state === 'recording') { stopRec(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { nova('This browser cannot use the microphone.'); return; }
    post('/stop').catch(function () {}); try { window.speechSynthesis.cancel(); } catch (e) {}
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recStream = stream; recChunks = [];
      rec = new MediaRecorder(stream);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
      rec.onstop = function () {
        var type = rec.mimeType || 'audio/webm';
        var blob = new Blob(recChunks, { type: type });
        micReset();
        if (blob.size < 1500) { nova('I did not hear anything. Tap the mic and try again.'); return; }
        addMsg('you', '...listening');
        var mine = logEl.lastChild;
        blobToB64(blob).then(function (b64) {
          return post('/listen', { audio_b64: b64, mime: type.split(';')[0] });
        }).then(function (d) {
          if (d.error) { mine.remove(); nova(d.error); return; }
          mine.textContent = d.heard;
          showReply(d);
        }).catch(function () { mine.remove(); offline(); });
      };
      rec.start();
      micBtn.setAttribute('aria-pressed', 'true');
      micBtn.textContent = 'Listening... tap to send';
      recTimer = setTimeout(stopRec, 15000);
    }).catch(function () { nova('I need permission to use the microphone. Allow it in the browser and try again.'); });
  });

  var awaitUntil = 0;

  /* ---------- talk to the Python server ---------- */
  var polling = false, mutedSynced = false;
  setInterval(function () {
    if (polling) return;
    polling = true;
    fetch('/status').then(function (r) { return r.json(); })
      .then(function (d) {
        speaking = !!d.speaking || browserSpeaking;
        (d.notices || []).forEach(function (n) { showReply(n); });
        if (!mutedSynced && typeof d.muted === 'boolean') { muted = d.muted; showMuted(); mutedSynced = true; }
      })
      .catch(function () { speaking = browserSpeaking; })
      .then(function () { polling = false; });
  }, 300);

  if (!greeted) { greeted = true; greet(); }

  /* ---------- animation loop ---------- */
  var level = 0, lastState = '';
  var stateLbl = document.getElementById('stateLbl');
  var cIdle = new THREE.Color(0x5b7cff), cListen = new THREE.Color(0x2ee6c8), cTalk = new THREE.Color(0xffb03a);
  var cIdle2 = new THREE.Color(0xb48cff), cListen2 = new THREE.Color(0x7dffe9), cTalk2 = new THREE.Color(0xff6b8a);
  var hx = 0, hy = 0;

  function tick() {
    requestAnimationFrame(tick);
    var now = performance.now() / 1000;
    var listening = (rec && rec.state === 'recording') || now < awaitUntil;

    if (!dragging) spinOffset *= 0.93;
    holder.rotation.y = spinOffset;

    // pulse: strong while talking, gentle while listening, slow breathing when idle
    var target = speaking ? (0.25 + Math.abs(Math.sin(now * 11)) * 0.45 * (0.6 + 0.4 * Math.sin(now * 4.7)))
               : listening ? 0.12 + 0.08 * Math.sin(now * 5)
               : 0.04 + 0.03 * Math.sin(now * 1.5);
    level += (target - level) * 0.25;
    orbUniforms.uLevel.value = level;
    orbUniforms.uTime.value = now;

    var st = speaking ? 'talking' : listening ? 'listening' : 'idle';
    if (st !== lastState) {
      lastState = st;
      stage.setAttribute('data-state', st);
      stateLbl.textContent = st === 'talking' ? 'Speaking' : st === 'listening' ? 'Listening' : 'Ready';
    }

    // colour shows what Nova is doing: blue idle, green listening, amber talking
    orbUniforms.uColor.value.lerp(speaking ? cTalk : listening ? cListen : cIdle, 0.08);
    orbUniforms.uColor2.value.lerp(speaking ? cTalk2 : listening ? cListen2 : cIdle2, 0.08);
    glow.material.color.copy(orbUniforms.uColor.value);
    glow.scale.setScalar(2.6 + level * 1.4);

    // drift toward the pointer, and float
    hx += (pointer.x * 0.25 - hx) * 0.06;
    hy += (pointer.y * 0.15 - hy) * 0.06;
    holder.position.x = hx;
    holder.position.y = hy + Math.sin(now * 1.5) * 0.03;
    orb.scale.setScalar(1 + level * 0.25);

    renderer.render(scene, camera);
  }
  resize();
  tick();
})();
</script>
</body>
</html>
